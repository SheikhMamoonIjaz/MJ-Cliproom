<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="MJ Cliproom 2.0.0 End-to-End Pipeline Architecture">
  <rect width="1200" height="320" rx="18" fill="#131f22"/>
  <text x="44" y="46" font-family="Barlow Condensed, Arial, sans-serif" font-weight="700" font-size="24" fill="#fff1d7">MJ CLIPROOM 2.0.0 — END-TO-END SELF-HOSTED PIPELINE</text>
  <text x="44" y="68" font-family="Geist, Segoe UI, sans-serif" font-size="13" fill="#a4b6b3">Durable stages with worker leases, idempotency keys, and isolated stage error recovery</text>
  <!-- Stage 1 -->
  <g transform="translate(36, 94)">
    <rect width="210" height="186" rx="12" fill="#1b2a2e" stroke="#314448"/>
    <rect x="16" y="16" width="54" height="24" rx="6" fill="#392824"/>
    <text x="43" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-weight="700" font-size="11" fill="#ffa27c">STAGE 1</text>
    <text x="16" y="62" font-family="Geist, sans-serif" font-weight="700" font-size="16" fill="#fff1d7">Intake &amp; Live Monitor</text>
    <text x="16" y="88" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• Local MP4/MOV/MKV files</text>
    <text x="16" y="110" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• YouTube, Twitch, Kick URLs</text>
    <text x="16" y="132" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• Debounced live handoff</text>
    <text x="16" y="154" font-family="Geist, sans-serif" font-size="12" fill="#81deb2">• Quarantine vs. raw source</text>
  </g>
  <!-- Stage 2 -->
  <g transform="translate(264, 94)">
    <rect width="210" height="186" rx="12" fill="#1b2a2e" stroke="#314448"/>
    <rect x="16" y="16" width="54" height="24" rx="6" fill="#392824"/>
    <text x="43" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-weight="700" font-size="11" fill="#ffa27c">STAGE 2</text>
    <text x="16" y="62" font-family="Geist, sans-serif" font-weight="700" font-size="16" fill="#fff1d7">12h ASR &amp; Loudness</text>
    <text x="16" y="88" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• Local Sherpa-ONNX Parakeet</text>
    <text x="16" y="110" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• Spoken-track auto captions</text>
    <text x="16" y="132" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• Streaming WAV loudness</text>
    <text x="16" y="154" font-family="Geist, sans-serif" font-size="12" fill="#81deb2">• Immutable words.json</text>
  </g>
  <!-- Stage 3 -->
  <g transform="translate(492, 94)">
    <rect width="216" height="186" rx="12" fill="#1b2a2e" stroke="#ffa27c"/>
    <rect x="16" y="16" width="54" height="24" rx="6" fill="#ffa27c"/>
    <text x="43" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-weight="700" font-size="11" fill="#132e33">STAGE 3</text>
    <text x="16" y="62" font-family="Geist, sans-serif" font-weight="700" font-size="16" fill="#fff1d7">3x4 AI Failover &amp; Brain</text>
    <text x="16" y="88" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• 3 distinct providers / round</text>
    <text x="16" y="110" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• 0s, 5s, 10s, 15s + Retry-After</text>
    <text x="16" y="132" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• Hook / Setup / Payoff picks</text>
    <text x="16" y="154" font-family="Geist, sans-serif" font-size="12" fill="#81deb2">• Batch-reconciled Summarizer</text>
  </g>
  <!-- Stage 4 -->
  <g transform="translate(726, 94)">
    <rect width="210" height="186" rx="12" fill="#1b2a2e" stroke="#314448"/>
    <rect x="16" y="16" width="54" height="24" rx="6" fill="#392824"/>
    <text x="43" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-weight="700" font-size="11" fill="#ffa27c">STAGE 4</text>
    <text x="16" y="62" font-family="Geist, sans-serif" font-weight="700" font-size="16" fill="#fff1d7">9:16 Safe Renderer</text>
    <text x="16" y="88" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• 1080x1920 Fit with Blur</text>
    <text x="16" y="110" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• Non-overlapping title-safe</text>
    <text x="16" y="132" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• 7 ASS/FFmpeg motion tags</text>
    <text x="16" y="154" font-family="Geist, sans-serif" font-size="12" fill="#81deb2">• Burned + Clean + SRT + VTT</text>
  </g>
  <!-- Stage 5 -->
  <g transform="translate(954, 94)">
    <rect width="210" height="186" rx="12" fill="#1b2a2e" stroke="#314448"/>
    <rect x="16" y="16" width="54" height="24" rx="6" fill="#392824"/>
    <text x="43" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-weight="700" font-size="11" fill="#ffa27c">STAGE 5</text>
    <text x="16" y="62" font-family="Geist, sans-serif" font-weight="700" font-size="16" fill="#fff1d7">Opt-In Publishing</text>
    <text x="16" y="88" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• YouTube Shorts 10m queue</text>
    <text x="16" y="110" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• Instagram Reels &amp; TikTok</text>
    <text x="16" y="132" font-family="Geist, sans-serif" font-size="12" fill="#bdccc8">• Near-duplicate copy guard</text>
    <text x="16" y="154" font-family="Geist, sans-serif" font-size="12" fill="#81deb2">• 7 statuses + Hold/Approve</text>
  </g>
</svg>
