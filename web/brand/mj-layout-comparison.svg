<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="MJ Cliproom 2.0.0 9:16 Vertical Layouts and Non-Overlapping Safe Zones">
  <rect width="1200" height="340" rx="18" fill="#122a30"/>
  <text x="44" y="44" font-family="Barlow Condensed, Arial, sans-serif" font-weight="700" font-size="24" fill="#fff1d7">CANONICAL 9:16 (1080 x 1920) VERTICAL COMPOSITIONS &amp; SAFE ZONES</text>
  <text x="44" y="66" font-family="Geist, Segoe UI, sans-serif" font-size="13" fill="#bfd1cf">Guaranteed non-overlapping vertical regions solved by studio/render.py :: solve_safe_layout()</text>

  <!-- Card 1: Fit with Blur -->
  <g transform="translate(44, 88)">
    <rect width="352" height="222" rx="12" fill="#192d32" stroke="#ffa27c" stroke-width="2"/>
    <rect x="18" y="18" width="106" height="186" rx="10" fill="#233438" stroke="#475d61"/>
    <rect x="20" y="72" width="102" height="68" fill="#1d3a40" stroke="#ffa27c"/>
    <rect x="28" y="158" width="86" height="24" rx="5" fill="#131f22"/>
    <text x="71" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#ffff00">CAPTIONS</text>
    <text x="142" y="42" font-family="Geist, sans-serif" font-weight="700" font-size="16" fill="#ffa27c">1. Fit with Blur (Default)</text>
    <text x="142" y="68" font-family="Geist, sans-serif" font-size="12" fill="#e5eeeb">• Preserves full 16:9 frame width</text>
    <text x="142" y="90" font-family="Geist, sans-serif" font-size="12" fill="#e5eeeb">• Gaussian-blurred 9:16 backdrop</text>
    <text x="142" y="112" font-family="Geist, sans-serif" font-size="12" fill="#e5eeeb">• Never crops HUD, slides, or guests</text>
    <text x="142" y="134" font-family="Geist, sans-serif" font-size="12" fill="#81deb2">• Ideal for Tutorials, Podcasts, GTA</text>
  </g>

  <!-- Card 2: Full-Screen Crop -->
  <g transform="translate(424, 88)">
    <rect width="352" height="222" rx="12" fill="#192d32" stroke="#314448"/>
    <rect x="18" y="18" width="106" height="186" rx="10" fill="#1d3a40" stroke="#475d61"/>
    <rect x="28" y="30" width="86" height="20" rx="4" fill="#ffa27c"/>
    <text x="71" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#132e33">HOOK CARD</text>
    <rect x="28" y="158" width="86" height="24" rx="5" fill="#131f22"/>
    <text x="71" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#ffff00">CAPTIONS</text>
    <text x="142" y="42" font-family="Geist, sans-serif" font-weight="700" font-size="16" fill="#fff1d7">2. 9:16 Full-Screen Crop</text>
    <text x="142" y="68" font-family="Geist, sans-serif" font-size="12" fill="#e5eeeb">• Edge-to-edge 1080x1920 action</text>
    <text x="142" y="90" font-family="Geist, sans-serif" font-size="12" fill="#e5eeeb">• Keyframed pan &amp; reaction zoom</text>
    <text x="142" y="112" font-family="Geist, sans-serif" font-size="12" fill="#e5eeeb">• Translucent rounded caption box</text>
    <text x="142" y="134" font-family="Geist, sans-serif" font-size="12" fill="#81deb2">• Ideal for High-Action Gameplay</text>
  </g>

  <!-- Card 3: Streamer Stack -->
  <g transform="translate(804, 88)">
    <rect width="352" height="222" rx="12" fill="#192d32" stroke="#314448"/>
    <rect x="18" y="18" width="106" height="186" rx="10" fill="#233438" stroke="#475d61"/>
    <rect x="20" y="20" width="102" height="110" rx="8" fill="#1d3a40"/>
    <rect x="20" y="132" width="102" height="70" rx="8" fill="#392824"/>
    <rect x="28" y="118" width="86" height="22" rx="5" fill="#131f22"/>
    <text x="71" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#ffff00">SEAM CAPTIONS</text>
    <text x="142" y="42" font-family="Geist, sans-serif" font-weight="700" font-size="16" fill="#fff1d7">3. Streamer Stack (Auto)</text>
    <text x="142" y="68" font-family="Geist, sans-serif" font-size="12" fill="#e5eeeb">• Gameplay top (1080x1180)</text>
    <text x="142" y="90" font-family="Geist, sans-serif" font-size="12" fill="#e5eeeb">• Facecam bottom (1080x740)</text>
    <text x="142" y="112" font-family="Geist, sans-serif" font-size="12" fill="#e5eeeb">• Auto facecam corner detector</text>
    <text x="142" y="134" font-family="Geist, sans-serif" font-size="12" fill="#81deb2">• Ideal for Facecam Streamers</text>
  </g>
</svg>
