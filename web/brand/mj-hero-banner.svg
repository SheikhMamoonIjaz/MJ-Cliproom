<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="MJ Cliproom 2.0.0 — Self-Hosted All-in-One 9:16 Vertical Video Workstation">
  <rect width="1200" height="360" rx="20" fill="#122a30"/>
  <rect x="18" y="18" width="1164" height="324" rx="14" fill="#192d32" stroke="#2c4042" stroke-width="2"/>
  <!-- Left Brand & Workstation Title -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#ffa27c"/>
    <text x="28" y="37" text-anchor="middle" font-family="Barlow Condensed, Arial, sans-serif" font-weight="700" font-size="26" fill="#132e33">MJ</text>
    <text x="74" y="30" font-family="Barlow Condensed, Arial, sans-serif" font-weight="700" font-size="32" fill="#fff1d7">MJ CLIPROOM 2.0.0</text>
    <text x="74" y="52" font-family="Geist, Segoe UI, sans-serif" font-weight="600" font-size="14" fill="#ffa27c">SELF-HOSTED 9:16 VERTICAL CLIPPING, SUMMARIZING &amp; PUBLISHING WORKSTATION</text>
    <text x="0" y="96" font-family="Geist, Segoe UI, sans-serif" font-size="15" fill="#bfd1cf">Built for gaming &amp; tournament streams, podcasts, interviews, tutorials, creator highlights, and MJ Plays GTA.</text>
    <!-- Feature Pills -->
    <g transform="translate(0, 122)" font-family="Geist, Segoe UI, sans-serif" font-size="13" font-weight="600">
      <rect x="0" y="0" width="166" height="34" rx="17" fill="#233438" stroke="#475d61"/>
      <text x="83" y="22" text-anchor="middle" fill="#fff1d7">9:16 Fit with Blur</text>
      <rect x="178" y="0" width="184" height="34" rx="17" fill="#233438" stroke="#475d61"/>
      <text x="270" y="22" text-anchor="middle" fill="#81deb2">3x4 AI Quota Failover</text>
      <rect x="374" y="0" width="194" height="34" rx="17" fill="#233438" stroke="#475d61"/>
      <text x="471" y="22" text-anchor="middle" fill="#ffa27c">12h Source Summarizer</text>
      <rect x="580" y="0" width="190" height="34" rx="17" fill="#233438" stroke="#475d61"/>
      <text x="675" y="22" text-anchor="middle" fill="#fff1d7">7-Status Upload Queue</text>
    </g>
    <!-- 6-Section Workstation Bar -->
    <g transform="translate(0, 184)" font-family="Geist, Segoe UI, sans-serif" font-size="12" font-weight="600">
      <rect x="0" y="0" width="770" height="54" rx="10" fill="#131f22" stroke="#314448"/>
      <rect x="10" y="10" width="96" height="34" rx="7" fill="#ffa27c"/>
      <text x="58" y="31" text-anchor="middle" fill="#132e33">1. Home</text>
      <text x="195" y="31" text-anchor="middle" fill="#e5eeeb">2. All Videos &amp; Live</text>
      <text x="330" y="31" text-anchor="middle" fill="#e5eeeb">3. 9:16 Editor</text>
      <text x="455" y="31" text-anchor="middle" fill="#e5eeeb">4. Summaries</text>
      <text x="580" y="31" text-anchor="middle" fill="#e5eeeb">5. Publishing</text>
      <text x="700" y="31" text-anchor="middle" fill="#e5eeeb">6. Settings</text>
    </g>
  </g>
  <!-- Right 9:16 Vertical Frame Preview -->
  <g transform="translate(910, 36)">
    <rect x="0" y="0" width="162" height="288" rx="16" fill="#0e1b1e" stroke="#ffa27c" stroke-width="2"/>
    <rect x="8" y="8" width="146" height="272" rx="11" fill="#233438"/>
    <rect x="18" y="26" width="126" height="28" rx="6" fill="#132e33"/>
    <text x="81" y="44" text-anchor="middle" font-family="Barlow Condensed, Arial, sans-serif" font-weight="700" font-size="13" fill="#ffa27c">HOOK SAFE ZONE</text>
    <rect x="8" y="92" width="146" height="94" fill="#1d3a40" stroke="#ffa27c" stroke-width="1"/>
    <text x="81" y="138" text-anchor="middle" font-family="Geist, Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#fff1d7">1080 x 1920</text>
    <text x="81" y="156" text-anchor="middle" font-family="Geist, Segoe UI, sans-serif" font-size="11" fill="#bfd1cf">Fit with Blur (9:16)</text>
    <rect x="18" y="216" width="126" height="36" rx="8" fill="#131f22" stroke="#475d61"/>
    <text x="81" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#ffff00">ROUNDED CAPTIONS</text>
  </g>
</svg>
