    <div style="max-height:240px;overflow-y:auto;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px">
      ${allClips.length ? allClips.map((c, i) => `<label class="ck" style="display:flex;margin:4px 0"><input type="checkbox" data-compclip value="${c.jid}/${c.cid}" ${i < 5 ? "checked" : ""}> <span style="margin-left:6px">${esc(c.title)}</span></label>`).join("") : "<p class='help'>No finished clips yet. Make some clips first.</p>"}
    </div>
    <div id="comp_result" style="margin-top:12px"></div>
    <div class="dlg-foot">
      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn primary" type="button" id="start_comp" ${allClips.length ? "" : "disabled"}>${ic("film")}Merge & Stitch 9:16</button>
    </div></div>`;
  $("[data-close]", dlg).onclick = () => dlg.close();
  $("#start_comp").onclick = async () => {
    const picked = $$("[data-compclip]:checked", dlg).map(el => el.value);
    if (!picked.length) return toast("Pick at least one clip.", "bad");
    const title = $("#comp_title").value.trim();
    $("#start_comp").disabled = true;
    $("#start_comp").textContent = "Stitching clips...";
    $("#comp_result").innerHTML = "<div class='note'>Running GPU concat demuxer...</div>";
    try {
      const res = await send("/api/v12/compilation", {clip_ids: picked, title});
      $("#comp_result").innerHTML = `<div class="card" style="padding:12px;background:var(--good-soft)">
        <b>${ic("check")} Compilation Ready (${res.count} clips)!</b>
        <p class="hint" style="margin:4px 0">File: ${esc(res.file)}</p>

      toast("Compilation created successfully!", "ok");
    } catch (err) {
      $("#comp_result").innerHTML = `<div class="note">${esc(err.message)}</div>`;
    } finally {
      $("#start_comp").disabled = false;
      $("#start_comp").textContent = "Merge & Stitch 9:16";
    }
  };
  dlg.showModal();
}

/* ============================================================ render + polling */
function render() {
  drawShell(); drawJobs(); drawStream(); drawSelBar();
  if (S.view === "overview") drawOverview();
  if ($("#clog")) drawLog();
  if (D.jid) drawClipDlg(false);
}
async function tick() {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(S.syncV || ""));
    const fresh = !!got.jobs, stale = Date.now() - (S.ovAt || 0) > 20000;
    S.syncV = got.v;
    if (!fresh) {                                   // nothing of ours changed on the server
      if (S.view === "overview" && stale) { S.overview = await api("/api/overview"); S.ovAt = Date.now(); render(); }
      return;
    }
    const {jobs, creators, accounts} = got;
    // a server from before multi-channel support sends only `channel`: show it as that platform's channel
    creators.forEach(c => { if (!c.channels) { const u = c.channel || "", k = /youtu/i.test(u) ? "youtube" : /twitch/i.test(u) ? "twitch" : /kick/i.test(u) ? "kick" : ""; c.channels = k ? {[k]: u} : {}; } });
    S.jobs = jobs; S.creators = creators; S.accounts = accounts;
    if (got.ai) S.status.ai = got.ai;
    if (got.unread != null) S.status.unread = got.unread;
    if (S.view === "overview") { S.overview = await api("/api/overview"); S.ovAt = Date.now(); }
    if (S.view === "autopilot" && !autoDirty && !document.activeElement?.closest?.("#auto")) loadAutopilot(false);
    if (S.view === "autopilot_posts" && !document.activeElement?.closest?.(".autopost-card")) loadAutopilotPosts();
    if (creatorId() && !creator()) return go("overview");
    render();
  } catch {}
}
// Back on the tab (or window): ask straight away instead of waiting out the slow background timer, and put a
// live player that fell behind while hidden back at the live edge.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  tick();
  if (hiddenAt && Date.now() - hiddenAt > 60000) {   // away a while: jump back to the live moment
    const pl = $("#stream .player"), f = pl?.querySelector("iframe");
    if (f) { const src = f.src; f.src = "about:blank"; requestAnimationFrame(() => { f.src = src; }); }
  }
  hiddenAt = 0;
});
window.addEventListener("focus", () => { if (!document.hidden) tick(); });
function loop() {
  const active = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => c.status === "queued" || c.status === "rendering"));
  // quick while something is being made, relaxed otherwise, and slow when the tab is in the background
  const waiting = S.creators.some(c => (c.channels && Object.keys(c.channels).length && !c.profile?.pic) || c.live_job && !jobOf(c.live_job));
  setTimeout(async () => { await tick(); loop(); }, document.hidden ? 20000 : waiting ? 1000 : active ? 2000 : 4000);
}

      b.disabled = false; return;
    }
    if (a === "tour") return startTour();
    if (a === "settab") { e.preventDefault(); S.stab = d.k; remember("settings", d.k); return drawSettings(); }
    if (a === "updhow") return updateHow();
    if (a === "restart-app") {
      b.disabled = true; b.textContent = "Restarting…";
      try {
        const previous = await api("/healthz", {cache:"no-store"});
        S.status.update_job = await send("/api/update", {});
        $("#releasedlg")?.close(); drawShell();
        toast("Restarting MJ Cliproom to activate the new version…", "ok");
        watchUpdate(previous);
      } catch (err) { b.disabled = false; b.textContent = "Restart now"; toast(err.message, "bad"); }
      return;
    }
    if (a === "update-now") {
      if (!rightsGateReady()) return toast("Restart MJ Cliproom before updating this server.", "bad");
      b.disabled = true; b.textContent = "Starting…";
      try {
        const previous = await api("/healthz", {cache:"no-store"});
        S.status.update_job = await send("/api/update", {});
        $("#releasedlg")?.close(); drawShell();
        toast("Update started. The page will reload after the launcher restarts the server.");
        watchUpdate(previous);
      } catch (err) { b.disabled = false; b.textContent = "Retry update"; toast(err.message, "bad"); }
      return;
    }
    if (a === "updlater") { try { localStorage.setItem("peakcut_update_seen", S.status.update?.latest || ""); } catch {} return drawShell(); }
    if (a === "storopen") { await send("/api/storage/open"); return; }
    if (a === "storchange") { S.storOpen = !S.storOpen; S.storNew = ""; return drawSettings(); }
    if (a === "storpick") {
      b.disabled = true;
      try { const r = await send("/api/storage/pick"); if (r.path) { S.storNew = r.path; $("#stor_new").value = r.path; } } finally { b.disabled = false; }
      return;
    }
    if (a === "storsave") {
      const s = await send("/api/storage", {path: $("#stor_new").value, move: $("#stor_move").checked}, "PUT");
      S.storOpen = false; toast("Saved. Close MJ Cliproom and start it again to switch to the new folder.", "ok"); return drawSettings();
    }
    if (a === "storcancel") { await send("/api/storage", {cancel: true}, "PUT"); toast("Kept the current folder", "ok"); return drawSettings(); }
    if (a === "appsetup") { S.setupOpen = d.p && S.setupOpen !== d.p ? d.p : ""; return drawSettings(); }
    if (a === "copytext") { await copyText(d.t); return toast("Copied", "ok"); }
    if (a === "appsave") {
      await send("/api/apps", {platform: d.p, client_id: $("#app_id").value, client_secret: $("#app_secret").value}, "PUT");
      S.setupOpen = ""; S.status = await api("/api/status"); toast("Saved. People can connect now.", "ok"); return drawSettings();
    }
    if (a === "bell") return openBell();
    if (a === "feedback") return openFeedback("bug");
    if (a === "report") return openFeedback("bug", d.ctx);
    if (a === "acctmenu") return openAcct();
    if (a === "bellread") { await markRead(); return openBell().then(openBell); }
    if (a === "ntgo") { closePops(); const l = d.link || ""; if (l.startsWith("/app")) { const [v, tab] = fromPath(l); return go(v, tab); } if (l.startsWith("/")) location.href = l; return; }
    if (a === "csave") return void await saveCreator();
    if (a === "cdiscard") { drawCreatorForm(); return toast("Changes discarded"); }
    if (a === "pause") {
      const settings = await send("/api/settings", {paused:!S.overview.paused}, "PUT");
      S.status.posting_paused = settings.paused;
      return loadOverview();
    }
    if (a === "pcancel" || a === "pretry") { await api(`/api/posts/${d.id}/${a === "pcancel" ? "cancel" : "retry"}`, {method:"POST"}); return loadOverview(); }
    if (a === "ssave") { await saveSettings(); toast("Saved", "ok"); return drawSettings(); }
    if (a === "plansave") {
      const p = {}; $$("#sform [data-plan]").forEach(i => { (p[i.dataset.plan] ??= {})[i.dataset.f] = Number(i.value); });
      await send("/api/settings", {plans:p}, "PUT"); S.status = await api("/api/status"); toast("Plans saved", "ok"); return drawSettings();
    }
    if (a === "testalert") { await saveSettings(); await api("/api/alerts/test", {method:"POST"}); return toast("Test message sent. Check your phone.", "ok"); }
    if (a === "ytcheck") {
      b.disabled = true;
      try {
        const info = await send(`/api/accounts/${encodeURIComponent(d.id)}/check-youtube`, {});
        return toast(`YouTube verified ${info.name}.`, "ok");
      } finally { b.disabled = false; }
    }
    if (a === "accremove") {
      if (!await ask("Disconnect this account?", "Posts still waiting for it will fail.", "Disconnect", true)) return;
      await api(`/api/accounts/${d.id}`, {method:"DELETE"}); await tick(); return drawSettings();
    }
    if (a === "replays") return openReplayPicker($("#url")?.value?.trim() || "");
    if (a === "clipsets") return openClipSets(b.closest("#selbar") ? selClips() : []);
    if (a === "sourceedit") return openSourceEditor(jobOf(d.j));
    if (a === "trimsourcereopen") {
      const job = jobOf(D.jid);
      const clip = job?.clips.find(item => item.id === D.cid);
      if (!clip) return;
      $("#clipdlg").close();
      return openSourceEditor(job, clip);
    }
    if (a === "retryvideo") { await send(`/api/jobs/${d.j}/retry`, {}); toast("Video queued for retry", "ok"); return tick(); }
    if (a === "regenjob") { await send(`/api/jobs/${d.j}/regenerate`, {}); toast("Video queued for regeneration with new prompts", "ok"); return tick(); }
    if (a === "selregen") {
      const {jobsSel} = selParts();
      if (jobsSel && jobsSel.length) {
        for (const jid of jobsSel) await send(`/api/jobs/${jid}/regenerate`, {});
        toast(`Queued ${jobsSel.length} video(s) for regeneration`, "ok");
      } else {
        await send("/api/jobs/regenerate-all", {});
        toast("All videos queued for regeneration", "ok");
      }
      return tick();
    }
    if (a === "resetcaptions") { const input = $("#captiondraft"); input.dataset.dirty = "reset"; input.value = ""; input.readOnly = false; return; }
    if (a === "saveglossary") { await saveCaptionGlossary($("#glossarydraft")); return toast("Caption glossary saved", "ok"); }
    if (a === "titlegenerate") {
      if (S.status.version !== RELEASE) {
        $("#metaresult").textContent = "Restart MJ Cliproom to use the updated AI generator.";
        return;
      }
      if (D.generating) return;
      const session = D.session;
      D.metaFormat = $("#metaformat").value;
      D.metaRegion = $("#metaregion").value;
      D.metaNotes = $("#metanotes").value;
      D.generating = b.disabled = true;
      b.textContent = "Generating…";
      $("#metaresult").textContent = "Researching and writing drafts…";
      try {
        const result = await send(`/api/jobs/${D.jid}/clips/${D.cid}/metadata`, {
          format:D.metaFormat, region:D.metaRegion, notes:D.metaNotes
        });
        if (session !== D.session || !$("#clipdlg").open) return;
        D.titleIdeas = result.ideas; D.titleModel = result.model;
        D.draftFormat = result.format; D.draftWarning = result.warning;
        D.research = result.research;
        $("#titleideas").innerHTML = titleIdeasHtml();
        $("#metaresult").textContent = `${result.count} draft${result.count === 1 ? "" : "s"} ready to review.`;
      } catch (error) {
        if (session === D.session && $("#clipdlg").open) $("#metaresult").textContent = error.message;
      } finally {
        if (session === D.session) {
          D.generating = false;
          const button = $("#clipdlg [data-act=titlegenerate]");
          if (button) { button.disabled = false; button.textContent = "Generate AI post text"; }
        }
      }
      return;
    }
    if (["titleapply", "titlecopy", "metaallapply", "titlepackcopy"].includes(a)) {
      const idea = D.titleIdeas[Number(d.i)]; if (!idea) return;
      const tags = (idea.hashtags || []).map(tag => "#" + tag).join(" ");
      if (a === "titlecopy") { await copyText(idea.title); return toast("Title copied", "ok"); }
      if (a === "titlepackcopy") {
        await copyText(`${idea.title}\n\n${idea.description}\n\n${tags}`);
        return toast("Title, description, and hashtags copied", "ok");
      }
      const patch = a === "titleapply" ? {title:idea.title}
        : {title:idea.title, description:idea.description, hashtags:tags};
      const session = D.session;
      const {clip} = await send(`/api/jobs/${D.jid}/clips/${D.cid}/metadata`, patch, "PUT");
      if (session === D.session && $("#clipdlg").open) {
        $("#clipdlg [data-f=title]").value = clip.title;
        if (a === "metaallapply") {
          $("#clipdlg [data-f=description]").value = clip.description;
          $("#clipdlg [data-f=hashtags]").value = clip.hashtags.map(tag => "#" + tag).join(" ");
        }
      }
      await tick(); return toast(a === "titleapply" ? "AI title saved to this clip" : "AI post text saved to this clip", "ok");
    }
    if (a === "savemeta") {
      const patch = {};
      $$("#clipdlg [data-f]").filter(i => ["title", "description", "hashtags"].includes(i.dataset.f))
        .forEach(i => patch[i.dataset.f] = i.value);
      await send(`/api/jobs/${D.jid}/clips/${D.cid}/metadata`, patch, "PUT");
      await tick(); return toast("Post text saved", "ok");
    }
    if (a === "musicupload") {
      const file = $("#musicfile").files?.[0]; if (!file) return toast("Choose a music file first.", "bad");
      b.disabled = true; const old = b.textContent; b.textContent = "Uploading…";
      try {
        const form = new FormData(); form.append("file", file);
        form.append("license", $("#musiclicense")?.value || "owner");
        form.append("genre", "other");
        form.append("mood", $("#musicmood")?.value || "hype");
        form.append("attribution", $("#musiccredit")?.value || "");
        form.append("rights", "true");
        const made = await api("/api/music", {method:"POST", body:form});
        S.status.music = await api("/api/music");
        const select = $("#clipdlg [data-f=music_id]");
        select.add(new Option(`${made.name} · ${fmt(made.duration)}`, made.id)); select.value = made.id;
        toast("Track added. Save and re-make the clip to mix it in.", "ok");
      } finally { b.disabled = false; b.textContent = old; }
      return;
    }
    if (a === "musicscan") {
      const found = await send("/api/music/scan", {folder: $("#musicfolder")?.value || "", rights: true});
      S.status.music = found.music || [];
      toast(`Added ${found.added} track${found.added === 1 ? "" : "s"}.`, "ok");
      drawClipDlg(true);
      return;
    }
    if (a === "musicdelete") {
      if (!await ask("Remove this background track?", "This deletes the uploaded audio file from your account. Clips using it must be unlinked first.", "Remove track", true)) return;
      const result = await api(`/api/music/${d.id}`, {method:"DELETE"});
      S.status.music = result.music || []; const select = $("#clipdlg [data-f=music_id]");
      select.querySelector(`option[value="${CSS.escape(d.id)}"]`)?.remove(); select.value = "";
      toast("Track removed", "ok"); return;
    }
    if (a === "remake") {
      const body = {}; $$("#clipdlg [data-f]").forEach(i => body[i.dataset.f] = i.type === "checkbox" ? i.checked : i.type === "number" ? Number(i.value) : i.value);
      const captions = readCaptionEditor($("#captiondraft"), body.start);
      if (captions !== undefined) body.caption_cues = captions;
      await send(`/api/jobs/${D.jid}/clips/${D.cid}/render`, body); toast("Re-making the clip…", "ok"); return tick();
    }
    if (a === "clip-connect-youtube") {
      $("#clipdlg").close();
      return go("settings", "apps");
    }
    if (a === "postnow" || a === "postqueue") {
      const metadata = {};
      $$("#clipdlg [data-f]").filter(i => ["title", "description", "hashtags"].includes(i.dataset.f))
        .forEach(i => metadata[i.dataset.f] = i.value);
      if (a === "postnow") return await postYoutube(b, [{job:D.jid, clip:D.cid, metadata}], saveYoutubeOptions());
      const accs = $$("#clipdlg [data-pacc]:checked").map(i => i.value);
      if (!accs.length) return toast("Tick at least one account first.", "bad");
      const result = await send("/api/posts", {job:D.jid, clip:D.cid, accounts:accs, metadata});
      const count = result.queued || 0;
      toast(`Added to the queue for ${count} account${count === 1 ? "" : "s"}.`, "ok"); return tick();
    }
  } catch (err) { b.disabled = false; toast(err.message, "bad"); }
});

$("#collapseBtn").innerHTML = ic("sidebar"); $("#menuBtn").innerHTML = ic("menu");
try { if (localStorage.getItem("mini")) $("#app").classList.add("mini"); } catch {}
$("#main").addEventListener("scroll", () => $(".topbar").classList.toggle("stuck", $("#main").scrollTop > 4), {passive:true});
(async () => {
  try { S.status = await api("/api/status"); } catch {}
  await loadPendingUploads();
  const q = new URLSearchParams(location.search);
  if (q.get("connected") || q.get("connect_error")) {
    const ok = q.get("connected"), err = q.get("connect_error"), nm = q.get("name");
    history.replaceState(null, "", location.pathname);
    setTimeout(() => ok ? toast(`${nm || ok} is connected. Pick it in a creator's Setup to post there.`, "ok") : toast(err, "bad"), 300);
  }
  if (q.get("verified")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast("Email confirmed. You're ready to clip.", "ok"), 300); }
  if (q.get("verify_error")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast(q.get("verify_error"), "bad"), 300); }
  if (location.pathname.startsWith("/app/")) { const [v, tab] = fromPath(location.pathname); S.view = v; S.ctab = tab; }  // the address decides, before anything loads
  await tick();
  { const [v, tab] = location.pathname.startsWith("/app/") ? fromPath(location.pathname) : ["library", "clips"]; go(v, tab, true); remember(S.view, S.ctab, "replace"); }
  try {  // a link pasted on the home page before signing up
    const link = sessionStorage.getItem("peakcut_link");
    if (link) { sessionStorage.removeItem("peakcut_link"); go("overview"); $("#url").value = link; onLink($("#url")); $("#url").focus(); toast("Your link is ready. Press Make clips.", "ok"); }
  } catch {}
  loop();
  let seenRelease = false;
  try { seenRelease = !!localStorage.getItem(whatsNewKey()); } catch {}
  if (S.status.version === RELEASE && !seenRelease) whatsNew(true);
  else if (S.status.tour && !$("#formdlg").open) setTimeout(startTour, 500);
  checkNew(true);
  setInterval(async () => { try { S.status = await api("/api/status"); drawShell(); if (S.view === "overview") drawOverview(); checkNew(); } catch {} }, 15000);
})();
</script>
<dialog id="sourcedlg" aria-label="Source timeline"></dialog>
<dialog id="collectiondlg" aria-label="Replay and clip collections"></dialog>
<script defer src="/assets/timeline.js"></script>
<script defer src="/assets/collections.js"></script>
</body>
</html>
