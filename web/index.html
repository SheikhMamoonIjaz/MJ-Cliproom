<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Geist:wght@400;500;600;700&family=Inter:wght@300&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<script>
const appearance = (() => {
  const key = "mj-cliproom.appearance";
  const system = matchMedia("(prefers-color-scheme: dark)");
  let choice = "system";
  function apply(value) {
    choice = value === "light" || value === "dark" ? value : "system";
    document.documentElement.dataset.theme = choice === "system" ? (system.matches ? "dark" : "light") : choice;
    document.querySelectorAll('input[name="appearance"]').forEach(input => {
      input.checked = input.value === choice;
    });
  }
  try { apply(localStorage.getItem(key)); } catch { apply("system"); }
  system.addEventListener("change", () => apply(choice));
  addEventListener("storage", event => {
    if (event.key === key || event.key === null) apply(event.newValue);
  });
  return {
    get choice() { return choice; },
    set(value) {
      apply(value);
      try { localStorage.setItem(key, choice); } catch {}
    },
  };
})();
</script>
<style>
:root{
  --brand:#ffa27c;--brand-press:#f3916b;--brand-ink:#132e33;--brand-soft:#f8e9e0;--brand-line:#efbca9;--brand-deep:#843a30;

  --bg:#f8faf7;--surface:#fff;--muted:#edf2ef;--hover:#e4ede8;--line:#dfe8e2;--line-2:#cbdad3;
  --accent-ink:#132e33;--warn:#7a3e0c;--warn-soft:#fff4e6;
  --text:#152d32;--dim:#4d6464;--faint:#5e7776;
  --good:#0F8A57;--good-soft:#E6F6EE;--bad:#D3343F;--bad-soft:#FDECEE;--live:#E5323F;
  --r-lg:16px;--r:12px;--r-sm:8px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --brand-soft:#392824;--brand-line:#704638;--brand-deep:#ffb397;--brand-ink:#eef5f2;
  --frame:#0e1b1e;--frame-2:#192d32;--frame-line:#2c4042;--frame-text:#eef5f2;--frame-dim:#a9bab8;
  --bg:#131f22;--surface:#1b2a2e;--muted:#233438;--hover:#2a3e42;--line:#314448;--line-2:#475d61;
  --text:#e5eeeb;--dim:#bdccc8;--faint:#a4b6b3;
  --good:#81deb2;--good-soft:#19382e;--bad:#ff9eaa;--bad-soft:#42262d;--warn:#ffca95;--warn-soft:#392b22;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--text);font:14px/1.5 "Geist","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none;fill:currentColor}
::selection{background:var(--brand-line)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:3px solid var(--surface)}

/* ---------- frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--frame);color:var(--frame-text);display:flex;flex-direction:column;height:100vh;height:100dvh;padding:14px 10px max(12px,env(safe-area-inset-bottom));min-width:0}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 22px 6px}
.side-head .logo{height:40px;width:auto;display:block}
.side-head .mark{display:none;width:34px;height:34px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);border:0;background:transparent;color:var(--dim);cursor:pointer;flex:none}
.side .icon-btn{color:var(--frame-dim)}
.icon-btn:active{background:var(--muted)}.side .icon-btn:active{background:var(--frame-2)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav h4{font-size:12px;font-weight:500;color:var(--frame-dim);padding:14px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 10px;border-radius:7px;border:0;background:transparent;color:var(--frame-text);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nav-item svg{width:17px;height:17px}
.nav-item svg{color:var(--frame-dim)}
.nav-item:active{background:var(--frame-2)}
.nav-item.on{background:var(--brand);color:var(--accent-ink);font-weight:600}
.nav-item.on svg{color:var(--accent-ink)}
.label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--frame-text);white-space:nowrap}
.nav-item.on .count{background:rgba(42,26,18,.14);color:var(--accent-ink)}
.avatar{width:26px;height:26px;border-radius:50%;background:rgba(255,162,124,.18);color:#ffa27c;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;overflow:hidden}
img.avatar{object-fit:cover;background:rgba(255,255,255,.08)}
.tav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--muted)}
#title{display:flex;align-items:center;gap:10px}
.chprev{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);animation:rise .25s ease both}
.chprev img,.chprev .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.chprev b{display:block;font-size:14px;color:var(--brand-ink)}
.chprev span{font-size:12px;color:var(--faint)}
.chprev.bad{background:var(--bad-soft);color:var(--bad);font-size:13px}
.chprev .sk{width:120px}
.nav-item.on .avatar{background:var(--accent-ink);color:var(--brand)}
.nav-item.on img.avatar{background:var(--accent-ink)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.3s infinite;flex:none}
.side-foot{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--frame-line)}
.side-card{background:var(--frame-2);border-radius:var(--r);padding:12px 14px;margin-top:8px;font-size:12px;color:var(--frame-dim);display:flex;flex-direction:column;gap:7px}
.side-card div{display:flex;align-items:center;gap:9px}
.led{width:7px;height:7px;border-radius:50%;background:#3DDC97;flex:none}.led.no{background:#FF6B78}.led.mid{background:var(--brand)}
.plans-btn{margin-top:10px;width:100%;background:var(--surface);color:var(--text);border:0}
.scrim{display:none}

main{background:var(--bg);margin:8px 8px 8px 0;border-radius:var(--r-lg);height:calc(100vh - 16px);height:calc(100dvh - 16px);overflow-y:auto;min-width:0;scrollbar-gutter:stable}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 28px;min-height:54px;border-bottom:1px solid transparent;transition:border-color .2s ease}
.topbar.stuck{border-color:var(--line)}
#vbanner:empty{display:none}
.upd{display:grid;gap:14px}
.upd ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--text);max-height:180px;overflow:auto}
.upd ul small{color:var(--dim)}
.upd .cmd{display:flex;gap:8px;align-items:center}
.upd .cmd code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:var(--muted);border-radius:8px;padding:9px 11px}
.upd h3{font-size:13px;font-weight:600;color:var(--brand-ink);margin:0}
.vb{display:flex;align-items:center;gap:12px;margin:12px 28px 0;padding:12px 12px 12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;animation:rise .3s ease both}
.vb svg{width:18px;height:18px;flex:none;color:var(--brand-deep)}
.vb span{flex:1;min-width:0}
.vb b{color:var(--warn)}
@media (max-width:640px){.vb{margin:10px 16px 0;flex-wrap:wrap}}
.topbar .titles{flex:1;min-width:0}
#tpic:empty{display:none}
#tpic img,#tpic .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;font-size:15px}
#tpic span.avatar{background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700}
#tpic.live img,#tpic.live .avatar{padding:2px;background:#fff;border:2px solid #E5323F}
.topbar.tabbed{border-color:var(--line)}
.topbar.tabbed .titles{flex:0 1 auto;max-width:34%}
.topbar.tabbed #actions{margin-left:auto}
.utabs:empty{display:none}
.utabs{display:flex;gap:2px;padding:3px;background:var(--muted);border-radius:11px;overflow-x:auto;scrollbar-width:none}
@media (min-width:761px){.topbar.tabbed{position:sticky}.topbar.tabbed .utabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.topbar.tabbed .titles{max-width:calc(50% - 230px)}}
@media (max-width:760px){.utabs{order:5;flex-basis:100%;margin:2px 0 0;position:relative}.topbar.tabbed .titles{max-width:none;flex:1}}
.utabs .tabbtn{height:34px;padding:0 14px;border-radius:8px;background:transparent;color:var(--dim);font-size:13px;transition:background-color .18s ease,color .18s ease}
.utabs .tabbtn:hover{background:var(--hover);color:var(--text)}
.utabs .tabbtn::after{display:none}
.utabs .tabbtn.on{background:transparent;color:var(--accent-ink)}
.utabs .tabbtn{position:relative;z-index:1}
.utabs .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--brand);z-index:0;transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}
.utabs .tabbtn,.utabs .tabbtn svg,.utabs .tabbtn .n{transition:color .25s ease,background-color .25s ease}
.utabs .tabbtn.on svg{color:var(--accent-ink)}
.utabs .tabbtn .n{background:var(--muted);color:var(--dim)}
.utabs .tabbtn.on .n{background:rgba(42,26,18,.14);color:var(--accent-ink)}
.rdot{flex:none;width:9px;height:9px;border-radius:50%;background:#fff}
.btn .rdot.on{background:#E5323F;animation:pulse 1.3s infinite}
/* live stream panel */
.stream{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:14px;background:#122a30;border-radius:16px;padding:12px;margin-bottom:22px;color:#fff1d7;animation:rise .3s ease both}
.stream .player{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.stream iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.noembed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:#102428;color:#fff1d7}
.noembed .logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:4px}
.noembed .logo svg{width:22px;height:22px}
.noembed b{font-size:15px;color:#fff}
.noembed span{font-size:13px;color:#bfd1cf;max-width:380px}
.noembed .btn{margin-top:6px}
.sinfo{display:flex;flex-direction:column;gap:12px;padding:6px 6px 4px 2px;min-width:0}
.sinfo .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sinfo .logo{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.sinfo .logo svg{width:16px;height:16px}
.sinfo .lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#E5323F;color:#fff;padding:3px 10px;border-radius:999px}
.sinfo .lv i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.sinfo h3{font-size:16px;line-height:1.4;font-weight:600;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sinfo .by{font-size:12px;color:#bfd1cf;margin-top:-6px}
.sstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.sstats div{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px}
.sstats b{display:block;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.01em}
.sstats span{font-size:11px;color:#bfd1cf}
.sinfo .cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sinfo .cta .btn{height:46px;width:100%;justify-content:center;font-size:15px}
.sinfo .cta small{font-size:12px;color:#bfd1cf;text-align:center}
.splat{display:flex;gap:4px;margin-left:auto}
.splat button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.06);color:#bfd1cf;cursor:pointer;transition:background-color .15s ease}
.splat button:hover{background:rgba(255,255,255,.12)}
.splat button.on{background:rgba(255,162,124,.22)}
.splat svg{width:15px;height:15px}
@media (max-width:960px){.stream{grid-template-columns:1fr}}
.sbadge{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;background:var(--muted);color:var(--dim)}
.sbadge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sbadge.live{background:var(--bad-soft);color:var(--bad)}.sbadge.live i,.sbadge.rec i{animation:pulse 1.3s infinite}
.sbadge.rec{background:#E5323F;color:#fff}
.sbadge svg{width:12px;height:12px}
.sbadge{white-space:nowrap;max-width:100%}
.topbar .titles{overflow:hidden}
@media (max-width:560px){#tpic img,#tpic .avatar{width:36px;height:36px}.topbar #actions .btn[data-act=golive]{font-size:0;gap:0;width:38px;padding:0;justify-content:center}.topbar #actions .btn[data-act=golive] .rdot{width:12px;height:12px}}
.ttabs{display:inline-flex;gap:2px;padding:3px;background:var(--muted);border-radius:10px}
.ttabs .tabbtn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--dim)}
.ttabs .tabbtn::after{display:none}
.ttabs .tabbtn svg{width:16px;height:16px}
.ttabs .tabbtn:hover{background:var(--hover);color:var(--text)}
.ttabs .tabbtn.on{background:var(--brand-soft);color:var(--brand-ink)}
.ttabs .tabbtn.on .n{background:var(--surface)}
#actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#actions a.btn{text-decoration:none}
@media (max-width:560px){#actions .btn .long{display:none}}
@media (max-width:900px){.ttabs .tabbtn .lbl{display:none}.ttabs .tabbtn{padding:0 10px}}
/* channels in Setup */
.chans{display:flex;flex-direction:column;gap:8px}
.chan{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);min-height:64px}
.chan .logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.chan .logo svg{width:20px;height:20px}
.chan .pic{flex:none;width:40px;height:40px;border-radius:50%;object-fit:cover;background:#e5eee9}
.chan .who{flex:1;min-width:0}
.chan .who b{display:block;font-size:14px;color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .who span{font-size:12px;color:var(--faint)}
.chan input{flex:1;min-width:0}
.chan .main{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap}
.chan .main input{accent-color:var(--brand);width:15px;height:15px;flex:none}
.chan .sbadge{margin:0}
@media (max-width:640px){.chan{flex-wrap:wrap}.chan .main{order:5}}
.topbar h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;font-weight:600;letter-spacing:.01em;color:var(--brand-ink)}
.topbar p{font-size:12px;color:var(--dim);margin-top:0;overflow-wrap:anywhere}
.icon-btn.menu{display:none}
.content{padding:28px 32px 72px;max-width:1280px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* ---------- collapsed sidebar */
.app.mini{grid-template-columns:76px minmax(0,1fr)}
.app.mini .side-head{flex-direction:column;padding:2px 0 18px}
.app.mini .side-head .logo{display:none}.app.mini .side-head .mark{display:block}
.app.mini .label,.app.mini .count,.app.mini .nav h4,.app.mini .side-card,.app.mini .plans-btn{display:none}
.app.mini .nav-item{justify-content:center;padding:0}
.app.mini .nav-item .live-dot{position:absolute;margin:-20px -22px 0 0}
.avatar.ring{border:2px solid #E5323F;padding:1px;background-clip:content-box}
img.avatar.ring{background:transparent}
.sb-tag{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#FF8A8A;background:rgba(229,50,63,.16);padding:1px 7px 1px 6px;border-radius:5px}
.sb-tag i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
.sb-tag.rec{background:#E5323F;color:#fff}
.nav-item.on .sb-tag{background:#E5323F;color:#fff}
.app.mini .sb-tag{display:none}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;font-weight:600}
.btn:active{background:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--accent-ink)}
.btn.primary:active{background:var(--brand-press);border-color:var(--brand-press)}
.btn.dark{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.btn.dark svg{color:var(--brand)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;gap:6px}
.btn.sm svg{width:16px;height:16px}
.btn.icon{width:32px;padding:0}
.btn.lg{height:44px;padding:0 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* ---------- fields */
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea){width:100%;height:40px;padding:0 12px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);min-width:0;outline:none;transition:border-color .15s ease}
:where(textarea){height:auto;padding:10px 12px;resize:vertical}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):hover{border-color:#D9CCC2}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):focus{background:var(--surface);border-color:var(--brand)}
input:not([type=checkbox],[type=radio],[type=range]):focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
label.f{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--dim);font-weight:600}
label.sw{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--text);font-weight:600}
label.sw input{appearance:none;width:38px;height:22px;border-radius:999px;background:#DCD2D0;position:relative;cursor:pointer;flex:none;margin:0}
label.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
label.sw input:checked{background:var(--brand)}label.sw input:checked::after{transform:translateX(16px)}
label.sw small{display:block;color:var(--dim);font-size:12px;font-weight:400}
label.ck{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:var(--r);cursor:pointer;background:var(--surface);border:1px solid var(--line-2);font-weight:500}
label.ck:has(input:checked){background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
label.ck input{accent-color:var(--brand);margin:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.span{grid-column:1/-1}

/* ---------- surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.card>h2,.card-head h2{font-size:15px;font-weight:600;color:var(--brand-ink)}
.card>h2{margin-bottom:4px}
.card>h2+.help{margin-bottom:18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.help,.sub{color:var(--dim);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabbtn{position:relative;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:0;background:transparent;color:var(--faint);cursor:pointer;font-weight:600;font-size:14px;border-radius:10px 10px 0 0;white-space:nowrap}
.tabbtn svg{width:17px;height:17px}
.tabbtn .n{font-size:11px;font-weight:600;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--muted);color:var(--dim);text-align:center;transition:background-color .15s ease,color .15s ease}
.tabbtn::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);opacity:0}
.tabbtn.on{color:var(--brand-ink)}
.tabbtn.on::after{opacity:1;animation:tabin .28s ease}
.tabbtn.on .n{background:var(--brand-soft);color:var(--brand-ink)}
.tabbtn.on svg{color:var(--brand)}
@keyframes tabin{from{transform:scaleX(.3);opacity:0}to{transform:none;opacity:1}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--muted);color:var(--dim);white-space:nowrap;text-decoration:none}
.pill.ok{color:var(--good);background:var(--good-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.pill.warn{color:var(--brand-deep);background:var(--brand-soft)}
.pill.live{color:#fff;background:var(--live)}
.pill.brand{color:var(--accent-ink);background:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.3}}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
.empty img{width:56px;height:56px;margin-bottom:12px}
.empty b{display:block;color:var(--brand-ink);font-size:15px;font-weight:600}

/* ---------- home hero + composer */
.hero{position:relative;padding:44px 28px 52px;text-align:center}
.hero .ga-bg{position:absolute;top:24px;bottom:-40px;left:0;width:100%;pointer-events:none;user-select:none;z-index:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%)}
.hero>:not(.ga-bg){position:relative;z-index:2}
#view{position:relative;z-index:1}
.hero h2{font-size:clamp(21px,5.2vw,28px);font-weight:700;letter-spacing:-.03em;color:var(--brand-ink);line-height:1.2;text-wrap:balance}
.hero>p{color:var(--dim);margin:8px auto 22px;max-width:520px;font-size:15px}
.guide-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:760px;margin:20px auto 0;text-align:left}
.g-step{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.g-step span.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink);font-size:12px;font-weight:700;margin-bottom:4px}
.g-step b{font-size:13px;color:var(--text)}
.g-step small{font-size:11px;color:var(--faint)}
@media (max-width:640px){.guide-steps{grid-template-columns:1fr}}
.composer{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);text-align:left;transition:background-color .15s ease,border-color .15s ease}
.composer:has(#url:focus){border-color:#ffa27c}
.composer.compact{max-width:none;margin-bottom:28px;background:var(--muted)}
.composer.over{background:var(--brand-soft);border-color:var(--brand)}
.composer :focus-visible{outline:none}
.composer-input{position:relative;display:flex;align-items:center}
.composer-input>svg{position:absolute;left:18px;color:var(--faint);width:20px;height:20px;transition:color .15s ease}
.composer-input:focus-within>svg{color:var(--brand)}
.composer-input input,.composer-input input:focus{height:60px;border:0;background:transparent;padding:0 18px 0 48px;font-size:16px;border-radius:var(--r-lg) var(--r-lg) 0 0}
.composer-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 14px 14px}
.composer-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.composer-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.composer-actions .btn{min-height:38px;padding:0 18px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--muted);color:var(--dim);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.composer.compact .chip{background:var(--surface)}
.chip svg{width:16px;height:16px}
.chip:hover,.chip:focus-visible{background:var(--hover);color:var(--text)}
.chip.on,.pick.open .chip{background:var(--brand-soft);color:var(--brand-ink)}
.hint{font-size:12px;color:var(--faint);margin-right:4px}
@media (max-width:680px){
  .composer-bar{flex-direction:column;align-items:stretch;gap:10px}
  .composer-tools{justify-content:flex-start}
  .composer-actions{margin-left:0;justify-content:space-between;width:100%}
  .composer-actions .btn{flex:1}
}
.composer-opts{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .32s ease,opacity .25s ease}
.composer-opts.open{grid-template-rows:1fr;opacity:1}
.composer-opts>.og{min-height:0;overflow:hidden;padding:0 12px;transition:padding .32s ease}
.composer-opts.open>.og{padding-bottom:12px}
/* attachments: link preview and files */
.att{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.att.has{grid-template-rows:1fr}
.att>div{min-height:0;overflow:hidden}
.att-in{display:flex;flex-direction:column;gap:8px;padding:0 12px 8px}
.lp{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:var(--muted);animation:rise .28s ease both}
.composer.compact .lp{background:var(--surface)}
.lp .th{position:relative;flex:none;width:112px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#2A1A12}
.lp .th img{width:100%;height:100%;object-fit:cover;display:block}
.lp .th .du{position:absolute;right:5px;bottom:5px;background:rgba(20,12,8,.82);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
.lp .tx{min-width:0;flex:1}
.lp .tx b{display:block;font-size:14px;font-weight:600;color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .tx span{display:block;font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .ok{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--good);background:var(--good-soft);padding:4px 10px;border-radius:999px}
.lp .ok svg{width:14px;height:14px}
.lp .ok.live{background:#E5323F;color:#fff}
.lp .ok.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.lp.bad{background:var(--bad-soft);color:var(--bad);font-size:13px;padding:10px 12px}
.lp.bad>span{flex:1;min-width:0}
.lp.bad b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bad)}
.lp.wait .rm{margin-left:auto}
.lp.bad svg{width:16px;height:16px;flex:none}
.lp.wait .th,.sk{background:linear-gradient(90deg,var(--muted) 0%,var(--surface) 50%,var(--muted) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sk{display:block;height:10px;border-radius:6px;margin:4px 0}
.lp{position:relative;overflow:hidden}
.lp .th video{width:100%;height:100%;object-fit:cover;display:block}
.lp .tx em{font-style:normal;color:var(--bad)}
.lp .ok.up{background:var(--brand-soft);color:var(--brand-ink);min-width:52px;justify-content:center}
.lp .rm{flex:none;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.lp .rm:hover,.lp .rm:focus-visible{background:var(--bad-soft);color:var(--bad)}
.lp .rm svg{width:14px;height:14px}
.lp .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);transition:width .2s ease}
.addrow{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:background-color .15s ease,color .15s ease;animation:rise .28s ease both}
.addrow:hover,.addrow:focus-visible{background:var(--brand-soft);color:var(--brand-ink)}
.addrow svg{width:16px;height:16px}
.addrow span{margin-left:auto;font-weight:500;color:var(--faint);font-size:12px}
@media (max-width:560px){.lp .th{width:88px}.lp .ok{display:none}}
.btn.primary:disabled{background:var(--muted);color:var(--dim);cursor:not-allowed}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.working{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--brand);background:rgba(255,162,124,.14);padding:2px 8px 2px 6px;border-radius:999px}
.working i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.nav-item.on .working{background:rgba(42,26,18,.14);color:var(--accent-ink)}
.app.mini .nav-item .working{display:none}

/* custom dropdown: a dark panel, no border or shadow needed against the white */
.pick{position:relative}
.pick .car{width:13px;height:13px;transition:transform .15s ease}
.pick.open .car{transform:rotate(180deg)}
.pick-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:230px;max-height:280px;overflow:auto;background:#2A1A12;border-radius:12px;padding:6px;
  opacity:0;visibility:hidden;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease,visibility .18s}
.pick.open .pick-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.pick-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:transparent;color:#E9DED6;border-radius:8px;font-size:13px;font-weight:500;text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.pick-opt:hover,.pick-opt:focus-visible{background:rgba(255,255,255,.08);color:#fff}
.pick-new{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;padding:8px 10px;border:0;border-top:1px solid rgba(255,255,255,.08);border-radius:0 0 8px 8px;background:transparent;color:#ffa27c;font-size:13px;font-weight:600;text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.pick-new:hover,.pick-new:focus-visible{background:rgba(255,162,124,.14);color:#FFC79D}
.pick-new .av{background:rgba(255,162,124,.18)}
.pick-empty{margin:6px 10px 4px;font-size:12px;line-height:1.45;color:#bfd1cf}
img.av{object-fit:cover}
.pick-opt .av,.pick-new .av{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,162,124,.18);color:#ffa27c}
.pick-new .av svg,.pick-opt .av svg{width:14px;height:14px}
.pick-opt .tick{margin-left:auto;width:15px;height:15px;color:var(--brand);visibility:hidden}
.pick-opt[aria-selected=true] .tick{visibility:visible}
.pick-opt[aria-selected=true]{color:#fff}

/* options panel */
.og{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ob{background:var(--muted);border-radius:12px;padding:12px 14px 14px;min-width:0}
.composer.compact .ob{background:var(--surface)}
.ob.wide{grid-column:1/-1}
.ot{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:10px}
.nsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nstep{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:10px;padding:10px 10px 8px}
.composer.compact .nstep{background:var(--muted)}
.nstep>span{font-size:12px;color:var(--faint)}
.nstep .ctl{display:flex;align-items:center;gap:6px}
.nstep .ctl button{flex:none;width:28px;height:28px;border-radius:8px;border:0;background:var(--muted);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.composer.compact .nstep .ctl button{background:var(--surface)}
.nstep .ctl button:hover,.nstep .ctl button:focus-visible{background:var(--brand);color:var(--accent-ink)}
.nstep .ctl button svg{width:14px;height:14px}
.nstep input,.nstep input:focus{flex:1;min-width:0;height:30px;padding:0;border:0;background:transparent;text-align:center;font-size:20px;font-weight:700;color:var(--brand-ink);-moz-appearance:textfield}
.nstep input::-webkit-inner-spin-button,.nstep input::-webkit-outer-spin-button,.range input::-webkit-inner-spin-button,.range input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.nstep .ctl i{font-style:normal;font-size:12px;color:var(--faint);width:10px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile-o{display:flex;flex-direction:column;gap:7px;padding:6px 6px 8px;border:0;border-radius:10px;background:var(--surface);color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:background-color .15s ease,color .15s ease}
.composer.compact .tile-o{background:var(--muted)}
.tile-o:hover,.tile-o:focus-visible{background:var(--hover);color:var(--text)}
.tile-o[aria-pressed=true]{background:var(--brand-soft);color:var(--brand-ink)}
.cap-prev{height:54px;border-radius:7px;background:#122a30;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-size:14px;line-height:1;color:#fff;letter-spacing:0;-webkit-text-stroke:1px #000;paint-order:stroke fill}
.cap-prev b{font-weight:inherit}
.lay-prev{height:54px;border-radius:7px;background:#122a30;display:grid;place-items:center}
.lay-prev .ph{position:relative;width:28px;height:48px;border-radius:4px;overflow:hidden;background:#4A3428}
.lay-prev .ph::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#B4643A,#5E3A2A);filter:blur(3px);opacity:.75}
.lay-prev .ph i{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:16px;background:linear-gradient(135deg,#ffa27c,#ffa27c)}
.lay-prev.crop .ph i{left:0;right:0;top:0;height:100%;transform:none}
.lay-prev.split .ph i{left:0;right:0;top:0;height:38%;transform:none;border-bottom:1px solid #122a30}
.lay-prev.split .ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(135deg,#ffa27c,#ffa27c)}
.lay-prev.stack .ph i{left:0;right:0;bottom:0;height:38%;transform:none;border-top:1px solid #122a30}
.lay-prev.stack .ph::after{content:"";position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(135deg,#ffa27c,#ffa27c)}
.seg{display:flex;gap:4px;background:var(--surface);border-radius:10px;padding:4px}
.composer.compact .seg{background:var(--muted)}
.seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 6px;border:0;border-radius:7px;background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.seg button small{font-size:11px;font-weight:500;color:var(--faint);transition:color .15s ease}
.seg button:hover,.seg button:focus-visible{background:var(--hover);color:var(--text)}
.seg button[aria-pressed=true]{background:var(--brand-soft);color:var(--brand-ink)}
.seg button[aria-pressed=true] small{color:var(--brand-deep)}
.range{display:flex;align-items:center;gap:8px}
.range label{flex:1;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:10px;padding:0 10px;height:44px;font-size:12px;color:var(--faint);min-width:0}
.composer.compact .range label{background:var(--muted)}
.range input,.range input:focus{flex:1;min-width:0;height:40px;border:0;background:transparent;padding:0;font-size:15px;font-weight:600;color:var(--brand-ink);-moz-appearance:textfield}
.range>svg{width:14px;height:14px;color:var(--faint);flex:none}
@media (max-width:640px){.og{grid-template-columns:1fr}.nsteps{grid-template-columns:1fr}}

/* ---------- home blocks */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column}
.tile i{width:32px;height:32px;border-radius:var(--r-sm);background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;margin-bottom:14px}
.tile i svg{width:18px;height:18px}
.tile b{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--brand-ink);line-height:1.1}
.tile span{font-size:13px;color:var(--dim);margin-top:2px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:16px;align-items:stretch}
.home-grid>.card:first-child{display:flex;flex-direction:column}
.home-grid>.card:first-child .chart{margin-top:auto}
.steps.across{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.home-grid>.card{margin-bottom:0}
.home-grid+.card,.home-grid+.card+.card{margin-top:16px}
.home-grid .ai-home{margin-bottom:0}
.kpis{display:flex;gap:24px;flex-wrap:wrap}
.kpi b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--dim)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin:2px 0 12px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{font:11px "Geist","Segoe UI",sans-serif;fill:var(--faint)}
.chart .b1{fill:var(--brand)}.chart .b2{fill:var(--brand-ink)}
.chart .none{font-size:13px;fill:var(--dim)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:var(--r);background:var(--muted);border:0;cursor:pointer}
.step:active{background:var(--line)}
.set-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.set-nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.set-link{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;color:var(--dim);text-decoration:none;transition:background-color .15s ease,color .15s ease}
.set-link svg{flex:none;width:18px;height:18px;margin-top:2px}
.set-link b{display:block;font-size:14px;font-weight:600;color:var(--text)}
.set-link small{display:block;font-size:12px;color:var(--faint);line-height:1.4}
.set-link:hover{background:var(--muted)}
.set-link.on{background:var(--brand-soft)}.set-link.on svg{color:var(--brand-deep)}.set-link.on b{color:var(--brand-ink)}
.set-body{min-width:0;animation:rise .25s ease both}
.ai-form{display:grid;gap:18px;max-width:560px}
.ai-form select{width:100%}
.ai-form .with{display:flex;gap:8px}.ai-form .with input{flex:1;min-width:0}
.ai-form .hint{font-size:12px;font-weight:400;color:var(--dim)}
.ai-form .hint a{color:var(--brand-deep);font-weight:600}
.ai-form .hint a:hover{color:var(--brand-ink)}
.ai-state{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.set-sec{padding:0 0 26px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.set-sec:last-child{border-bottom:0}
.set-sec h2{font-size:17px;color:var(--brand-ink);margin-bottom:4px}
.set-sec .help{margin-bottom:16px}
.appearance-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:600px;min-width:0;margin:0;padding:0;border:0}
.appearance-choices legend{margin-bottom:10px;padding:0;color:var(--dim);font-size:12px;font-weight:600}
.appearance-option{min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:10px;color:var(--text);font-weight:600}
.appearance-option:hover{border-color:var(--brand-deep)}
.appearance-option:has(input:checked){border-color:var(--brand-deep);background:var(--brand-soft)}
.appearance-option input{margin:0;accent-color:var(--brand-deep)}
.appearance-swatch{width:100%;height:56px;display:grid;grid-template-columns:27% 1fr;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:#f3f6f3}
.appearance-swatch::before{content:"";background:#122a30}
.appearance-swatch::after{content:"";margin:11px 9px;background:#fff;border:1px solid #cbdad3;border-top:4px solid var(--brand);border-radius:4px}
.appearance-swatch.dark{background:#131f22}.appearance-swatch.dark::before{background:#0e1b1e}.appearance-swatch.dark::after{background:#233438;border-color:#475d61;border-top-color:var(--brand)}
.appearance-swatch.system{background:linear-gradient(90deg,#f3f6f3 50%,#131f22 50%)}
.appearance-swatch.system::after{background:linear-gradient(90deg,#fff 32%,#233438 32%)}
.set-load{padding:40px 0;color:var(--faint)}
.fields.narrow{max-width:420px;grid-template-columns:1fr}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.prof-pic{width:56px;height:56px;font-size:22px;border-radius:50%;object-fit:cover;color:#fff}
.prof b{display:block;font-size:16px;color:var(--brand-ink)}.prof span{font-size:13px;color:var(--dim)}
.kv{margin:0 0 12px;border-top:1px solid var(--line)}
.kv div{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv dt{font-size:13px;color:var(--dim)}.kv dd{margin:0;font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.apps{display:flex;flex-direction:column;gap:10px}
.appcard{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.applogo{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.applogo svg{width:22px;height:22px}
.apptx{flex:1;min-width:0}.apptx>b{display:block;font-size:15px;color:var(--brand-ink)}.apptx>span{font-size:13px;color:var(--dim)}
.appact{flex:none}
.appcard{flex-wrap:wrap}
.stor-path{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stor-path code{flex:1 1 260px;min-width:0;overflow-wrap:anywhere;font-size:13px;background:var(--muted);border-radius:8px;padding:10px 12px}
.stor-bar{height:10px;border-radius:999px;background:var(--muted);overflow:hidden;margin:14px 0 6px}
.stor-bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.stor-bar.low i{background:var(--bad)}
.stor-nums{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.stor-change{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--muted);display:grid;gap:12px}
.stor-change .with{display:flex;gap:8px}.stor-change .with input{flex:1;min-width:0}
.appsetup{flex-basis:100%;margin-top:4px;padding:14px 16px;border-radius:10px;background:var(--muted);display:grid;gap:12px}
.appsetup ol{margin:0;padding-left:18px;font-size:13px;color:var(--text);display:grid;gap:4px}
.appsetup a{color:var(--brand-deep);font-weight:600}
.appsetup a:hover{color:var(--brand-ink)}
.appsetup .copyrow{display:flex;gap:8px;align-items:center}
.appsetup .copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.appsetup .warnline{font-size:12px;color:var(--brand-deep)}
.appact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.applist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.applist div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.applist .btn{margin-left:auto}
@media (max-width:860px){.set-layout{grid-template-columns:1fr;gap:16px}.set-nav{position:static;flex-direction:row;overflow-x:auto}.set-link small{display:none}.set-link{flex:none}.kv div{grid-template-columns:1fr;gap:2px}}
.savebar{position:sticky;bottom:16px;z-index:4;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;margin-top:8px;border-radius:14px;background:var(--accent-ink);color:#F4ECE6;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.savebar.on{opacity:1;transform:none;pointer-events:auto}
.savebar>span{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.savebar>span svg{width:16px;height:16px;color:var(--brand)}
.savebar .btn.ghost{color:#E9DED6;background:transparent;border-color:transparent}
.savebar .btn.ghost:hover{background:rgba(255,255,255,.08)}
.step .n{width:26px;height:26px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:var(--brand-ink)}
.step b{display:block;font-weight:600;color:var(--text)}
.step .d{font-size:12px;color:var(--dim)}
.step>svg{color:var(--faint);margin-left:auto}
.allset{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--good-soft);color:var(--good);font-weight:600}

/* ---------- jobs + clips */
.job{margin-bottom:36px}
.job-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.job-actions{flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:100%}
.job-actions .btn{flex:none}
.job-error{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:10px;background:var(--bad-soft)}
.job-error-copy{flex:1;min-width:0}
.job-error-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jt{display:flex;gap:14px;align-items:center;min-width:0}
.jthumb{position:relative;flex:none;width:128px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--muted);display:grid;place-items:center;color:var(--faint)}
.jthumb img{width:100%;height:100%;object-fit:cover;display:block}
.jthumb>svg{width:22px;height:22px}
.jthumb .du{position:absolute;right:5px;bottom:5px;background:rgba(20,12,8,.82);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
@media (max-width:560px){.jthumb{width:92px}}
.job-head h3{font-size:15px;font-weight:600;overflow-wrap:anywhere;color:var(--brand-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;background:var(--muted);border-radius:999px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .8s ease}
.bar.pending i{width:20%;animation:transfer-pending 1.6s ease-in-out infinite alternate}
@keyframes transfer-pending{to{transform:translateX(400%)}}
.err{color:var(--bad);font-size:13px;overflow-wrap:anywhere;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:9/16;background:#17110E;border:0;padding:0;cursor:pointer;display:block;width:100%;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .veil{position:absolute;left:10px;bottom:10px}
.veil span{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--accent-ink)}
.veil svg{width:15px;height:15px;margin-left:2px}
.badge{position:absolute;top:10px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:var(--surface);color:var(--brand-ink)}
.badge.l{left:10px}.badge.r{right:10px}
.badge.s-hi{background:var(--brand);color:var(--accent-ink)}.badge.s-mid{background:#FFE3CC;color:var(--accent-ink)}
.making{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--dim);font-size:13px;font-weight:500;background:linear-gradient(110deg,#F4EFEE 30%,#FBF8F7 50%,#F4EFEE 70%);background-size:220% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.clip-body{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.hook{font-weight:600;font-size:13px;color:var(--brand-ink)}
.ttl{color:var(--dim);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.selck{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;cursor:pointer;flex:none;transition:background-color .15s ease}
.selck:hover{background:var(--brand-soft)}
.selck input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;margin:0}
.clip.picked{border-color:var(--brand)}
#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 24px);padding:10px 12px 10px 18px;border-radius:14px;background:#1F140D;color:#FFF4EA;font-size:14px;border:1px solid rgba(255,178,122,.25)}
#selbar.on{display:flex}
#selbar b{font-weight:700;margin-right:6px}
#selbar .btn{background:transparent;color:#FFF4EA;border-color:rgba(255,244,234,.25)}
#selbar .btn:hover{background:rgba(255,244,234,.1)}
#selbar .btn.primary{background:var(--brand);color:#1F140D;border-color:var(--brand)}
#selbar .btn.primary:hover{background:#FFA25C}
#selbar .btn.danger{color:#FF9A8F;border-color:rgba(255,154,143,.45)}
#selbar .btn.danger:hover{background:rgba(255,154,143,.14)}
.danger-card{border-color:#F3C9C4}
.danger-card h2{color:var(--bad)}
.clip-foot{display:flex;gap:4px;align-items:center;margin-top:auto;padding-top:8px}

/* ---------- live */
.livecard{background:var(--surface);border:1px solid #F4C9CD;border-radius:var(--r);padding:20px;margin-bottom:28px}
.lc-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.lc-title{flex:1;min-width:0}
.lc-title h3{margin-top:8px;font-size:16px;line-height:1.4;color:var(--brand-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lc-acts{flex:none;display:flex;gap:8px;align-items:center}
.lc-acts .btn{height:40px}
@media (max-width:900px){.lc-head{flex-direction:column}.lc-acts{width:100%}.lc-acts .btn{flex:1;justify-content:center}}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0}
.stat b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.evbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 0;border:0;background:transparent;font:inherit;font-size:20px;font-weight:600;color:var(--brand-ink);cursor:pointer;border-radius:8px;transition:color .15s ease}
.evbtn:hover,.evpick.open .evbtn{color:var(--brand)}
.evbtn .car{width:14px;height:14px;color:var(--faint)}
.evpick .pick-menu{min-width:240px}
.pick-opt .ph{font-size:11px;color:#9C8A7E;margin-left:6px}
.stat .evpick .pick-opt .pl{font-size:13px;color:inherit}.stat .evpick .pick-opt .ph{font-size:11px;color:#9C8A7E}.stat .evpick .evbtn .pv{font-size:20px;color:inherit}
.autonote{font-size:12px;color:var(--faint);margin:-8px 0 14px}.stat span{font-size:12px;color:var(--dim)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.meter{background:var(--muted);border-radius:var(--r);padding:12px 14px}
.meter h4{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:9px}
.spark{display:flex;align-items:flex-end;gap:1px;height:46px}
.spark i{flex:1;background:var(--brand);min-height:2px;border-radius:1px}.spark.chat i{background:var(--good)}
.said{font-size:13px;color:var(--faint);height:76px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.said div:last-child{color:var(--text)}
.livecard.alarm-dark{background:#0d1117;color:#e6edf3;border:1px solid #30363d;box-shadow:0 0 20px rgba(0,0,0,.45)}
.livecard.alarm-dark .lc-title h3{color:#58a6ff}
.livecard.alarm-dark .stat b{color:#f0f6fc}
.livecard.alarm-dark .stat span{color:#8b949e}
.livecard.alarm-dark .meter{background:#161b22;border:1px solid #21262d}
.livecard.alarm-dark .meter h4{color:#8b949e}
.livecard.alarm-dark .said{color:#8b949e}
.livecard.alarm-dark .said div:last-child{color:#58a6ff}
.alarm-banner{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--r-sm);margin-bottom:14px;font-size:13px;font-weight:600}
.alarm-banner.active{background:rgba(248,81,73,.15);border:1px solid #f85149;color:#ff7b72;animation:alarmPulse 1.2s infinite}
.alarm-banner.idle{background:rgba(56,139,253,.15);border:1px solid #388bfd;color:#58a6ff}
@keyframes alarmPulse{0%,100%{opacity:1}50%{opacity:.65}}
.live-stream-embed{width:100%;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;background:#000;margin-bottom:16px}
.live-stream-embed iframe{width:100%;height:100%;border:0}

/* ---------- tables + logs */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--faint);padding:0 10px 10px;white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
a.lnk{color:var(--brand-ink);text-decoration:none;font-weight:600}
.log{display:flex;flex-direction:column}
.log div{display:flex;gap:14px;padding:11px 0;font-size:13px}
.log div+div{border-top:1px solid var(--line)}
.log time{color:var(--faint);white-space:nowrap;flex:none;width:118px}

/* ---------- plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line-2);cursor:pointer;font-size:13px;color:var(--dim)}
.plan b{font-size:16px;font-weight:600;color:var(--brand-ink);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.plan b svg{color:var(--brand)}
.plan em{position:absolute;top:16px;right:16px;font-style:normal;font-size:11px;font-weight:600;background:var(--accent-ink);color:var(--brand);padding:2px 8px;border-radius:999px}
.plan input{position:absolute;opacity:0;pointer-events:none}
.plan.on{background:var(--brand-soft);border-color:var(--brand)}
.plan:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}

/* ---------- dialogs + toasts */
dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--r-lg);padding:0;max-width:calc(100vw - 32px)}
dialog.release-dialog{width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
.release-dialog .dlg{width:100%;box-sizing:border-box}
.release-dialog textarea{width:100%;min-height:6rem;resize:vertical}
.release-dialog fieldset{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;margin:8px 0 12px;min-width:0}
.release-dialog .dlg-foot{flex-wrap:wrap}
.release-dialog .err{overflow-wrap:anywhere}
dialog::backdrop{background:rgba(14,12,11,.42);animation:fadein .16s ease}
.dlg{padding:24px;width:450px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:18px;font-weight:600;color:var(--brand-ink)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.editor{display:grid;grid-template-columns:minmax(220px,340px) minmax(280px,1fr);width:min(1040px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
.editor .stage{background:#17110E;display:grid;place-items:center;position:relative;min-height:320px}
.editor video,.editor .stage img{width:100%;max-height:calc(100vh - 48px);aspect-ratio:9/16;object-fit:contain;display:block}
.editor .panel{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.music-picks{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.music-picks summary{cursor:pointer;font-weight:600;color:var(--brand-ink)}
.ncs-list{display:grid;gap:8px}
.ncs-list .row{border-top:1px solid var(--line);padding-top:8px;align-items:center}
.ncs-list small{display:block;color:var(--faint);font-size:11px}
#sourcedlg{width:min(1120px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
#collectiondlg{width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
.source-editor{padding:20px;display:grid;gap:16px}
.source-editor header,.source-editor .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.source-editor header{justify-content:space-between}
.source-editor header h2{font-size:20px}
.source-columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(270px,1fr);gap:20px}
.source-frame{position:relative;background:#14110f;border-radius:8px;overflow:hidden}
.live-overlay{position:absolute;left:8%;right:8%;display:flex;flex-direction:column;gap:6px;pointer-events:none;text-align:center;color:#fff;text-shadow:0 1px 2px #000}
.live-overlay[data-place=bottom]{bottom:12%}.live-overlay[data-place=middle]{top:42%}.live-overlay[data-place=top]{top:12%}
.live-overlay b{font-size:18px}.layout-picks{display:flex;flex-wrap:wrap;gap:6px}
.layout-picks [aria-pressed=true]{background:var(--brand-soft);color:var(--brand-ink)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
dialog{max-height:calc(100dvh - 24px)}
#clipdlg{width:min(1040px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
.source-frame video{display:block;width:100%;height:min(40vh,380px);object-fit:contain}
.source-crop{position:absolute;border:2px solid var(--brand);pointer-events:none}
.source-editor canvas{display:block;width:100%;height:66px;margin:10px 0 6px;cursor:crosshair;border-radius:4px}
.source-editor input[type=range]{display:block;width:100%;padding:0;accent-color:var(--brand-deep)}
.source-fields{display:grid;gap:9px;align-content:start}
.timeline-markers{margin-top:8px}
.timeline-markers span{display:inline-flex}
.caption-draft{min-height:7em;font-family:ui-monospace,Consolas,monospace}
@media(max-width:760px){.source-columns{grid-template-columns:1fr}}
.editor h3{font-size:13px;font-weight:600;color:var(--dim);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--frame);color:var(--frame-text);border:1px solid var(--frame-2);border-radius:var(--r);padding:12px 16px;max-width:380px;animation:rise .2s ease;display:flex;gap:10px;align-items:center;font-weight:500}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.toast.ok::before{background:#3DDC97}.toast.bad::before{background:#FF6B78}
.toast .rep{margin-left:auto;border:0;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.toast .rep:hover{background:rgba(255,255,255,.18)}
.err .rep{margin-left:8px;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}

.ntoast{display:flex;gap:12px;align-items:flex-start;width:340px;max-width:calc(100vw - 40px);padding:12px 12px 12px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);cursor:pointer;text-align:left;
  animation:ntin .35s cubic-bezier(.2,.8,.2,1) both;transition:background-color .15s ease}
.ntoast:hover{background:var(--hover)}
.ntoast.out{animation:ntout .25s ease forwards}
.ntoast i{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep)}
.ntoast i svg{width:17px;height:17px}
.ntoast.k-expiry i{background:var(--warn-soft);color:var(--warn)}.ntoast.k-post i{background:var(--bad-soft);color:var(--bad)}.ntoast.k-live i{background:var(--bad-soft);color:var(--bad)}.ntoast.k-clips i{background:var(--good-soft);color:var(--good)}
.ntoast .tx{flex:1;min-width:0}
.ntoast b{display:block;font-size:13px;font-weight:600;color:var(--brand-ink);line-height:1.35}
.ntoast span{display:block;font-size:12px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.ntoast .x{flex:none;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer}
.ntoast .x:hover{background:var(--muted);color:var(--text)}

<body>
<div class="app" id="app">
  <aside class="side" aria-label="Sidebar">
    <div class="side-head"><img class="logo" src="/brand/mj-wordmark-light.svg" alt="MJ Cliproom"><img class="mark" src="/brand/mj-mark.svg" alt="MJ Cliproom">
      <button class="icon-btn collapse" data-act="collapse" id="collapseBtn" aria-label="Collapse sidebar"></button></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <div class="scrim" data-act="menu"></div>

const clock = t => new Date(t * 1000).toLocaleString([], {weekday:"short", hour:"2-digit", minute:"2-digit"});

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (r.status === 401) { location.href = "/login"; throw new Error("Please sign in."); }
  if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch {} throw new Error(typeof d === "string" ? d : "Something went wrong"); }
  return r.json();
}
const send = (path, body, method = "POST") => api(path, {method, headers:{"Content-Type":"application/json"}, body:JSON.stringify(body ?? {})});
async function copyText(text) {
  if (!text) return false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.style.top = "0";
    ta.setAttribute("readonly", "");
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch {
    return false;
  }
}
function toast(msg, kind = "") {
  if (!msg) return;
  const t = document.createElement("div"); t.className = "toast " + kind; t.textContent = msg;
  if (kind === "bad") { const r = document.createElement("button"); r.className = "rep"; r.textContent = "Report"; r.onclick = () => { t.remove(); openFeedback("bug", msg); }; t.append(r); }
  const open = document.querySelector("dialog[open]");
  (open || $("#toasts")).append(t); setTimeout(() => t.remove(), kind === "bad" ? 7000 : 3200);
}
const cache = new WeakMap();
function put(el, html) { if (el && cache.get(el) !== html) { cache.set(el, html); el.innerHTML = html; } }
function ask(title, text, okLabel = "Confirm", danger = false) {
  return new Promise(res => {
    const d = $("#formdlg");
    d.innerHTML = `<form method="dialog" class="dlg"><h2>${esc(title)}</h2><p class="help">${esc(text)}</p>
      <div class="dlg-foot"><button class="btn" value="no">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" value="yes" autofocus>${esc(okLabel)}</button></div></form>`;
    d.onclose = () => res(d.returnValue === "yes"); d.returnValue = "no"; d.showModal();
  });
}

const transferSamples = new Map();
function transferEta(job, transfer) {
  if (!transfer?.total || transfer.bytes == null) return null;
  const key = `${job.id}:${transfer.track || "source"}`, now = Date.now(), bytes = Number(transfer.bytes);
  const prev = transferSamples.get(key);
  if (!prev || bytes < prev.bytes) {
    transferSamples.set(key, {bytes, at: now, speed: 0});
    return null;
  }
  const elapsed = (now - prev.at) / 1000;
  if (elapsed >= 0.7 && bytes > prev.bytes) {

    prev.speed = prev.speed ? prev.speed * 0.7 + instant * 0.3 : instant;
    prev.bytes = bytes;
    prev.at = now;
  }

function remainingLabel(seconds, waiting = "estimating time remaining") {
  if (seconds == null || !Number.isFinite(Number(seconds))) return waiting;
  return Number(seconds) < 60 ? "under a minute remaining" : `about ${fmt(seconds)} remaining`;
}
function jobProgress(job) {
  const transfer = job.transfer;
  if (!transfer) {
    const percent = Math.round(job.progress * 100);
    const render = job.render_pending_clips > 0
      ? ` · ${job.render_pending_clips} clip${job.render_pending_clips === 1 ? "" : "s"} rendering · ${remainingLabel(job.render_eta_seconds, "estimating render time")}` : "";
    return {percent, label: job.stage + " · " + percent + "%" + render};
  }

  const total = transfer.total;
  if (!total) return {percent: null, label: title + " · " + size(transfer.bytes) + " received"};
  const percent = Math.round(Math.min(1, transfer.bytes / total) * 100);
  const eta = transferEta(job, transfer);
  return {percent, label: title + " · " + size(transfer.bytes) + " of " + size(total) + " · " + percent + "% · " + remainingLabel(eta)};
}

async function lookUp(u) {

// A big file goes in pieces (anything standing in front of the app refuses one huge request), two at a time,
// and a piece that fails is simply sent again. The bar shows the whole file.
async function uploadFingerprint(file) {
  if (!globalThis.crypto?.subtle) throw new Error("This browser can't safely verify a saved upload. Open MJ Cliproom in an up-to-date browser.");
  const edge = 1024 * 1024;
  const first = new Uint8Array(await file.slice(0, edge).arrayBuffer());
  const last = new Uint8Array(await file.slice(Math.max(0, file.size - edge)).arrayBuffer());
  const meta = new TextEncoder().encode(`${file.name}\0${file.size}\0${file.lastModified || 0}\0`);
  const sample = new Uint8Array(meta.length + first.length + last.length);
  sample.set(meta); sample.set(first, meta.length); sample.set(last, meta.length + first.length);
  return [...new Uint8Array(await crypto.subtle.digest("SHA-256", sample))].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function sendBig(f, who) {
  const file = f.file;
  const fingerprint = await uploadFingerprint(file);
  const s = f.resumeUploadId ? await api(`/api/upload/${encodeURIComponent(f.resumeUploadId)}`)
    : await send("/api/upload/start", {name: file.name, size: file.size, fingerprint, options: jobOptions(), creator: who, rights_cleared: true});
  if (s.size !== file.size || s.fingerprint !== fingerprint) throw new Error("That file doesn't match the saved upload. Choose the same original file or discard the saved upload and start again.");
  if ((s.creator || "") !== (who || "")) throw new Error("Open the same creator workspace used when this upload started, then resume it there.");
  const received = new Set(s.received || []);
  const sent = new Array(s.parts).fill(0);
  received.forEach(i => { if (Number.isInteger(i) && i >= 0 && i < s.parts) sent[i] = Math.min(s.part, file.size - i * s.part); });
  const show = () => { f.pct = Math.min(99, Math.round(sent.reduce((a, b) => a + b, 0) / file.size * 100)); drawAtt(); };
  const put = i => new Promise((ok, fail) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/api/upload/${s.id}/${i}`);
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => { sent[i] = e.loaded; show(); };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) { sent[i] = Math.min(s.part, file.size - i * s.part); show(); return ok(); }
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      const err = new Error(typeof d === "string" ? d : "Upload failed"); err.final = x.status >= 400 && x.status < 500 && x.status !== 408 && x.status !== 429; fail(err);
    };
    x.onerror = x.ontimeout = () => fail(new Error("Upload failed. Check your connection."));

    while (next < s.parts && !failure) {

      for (let tries = 0; ; tries++) {
        try { await put(i); received.add(i); break; }
        catch (e) { sent[i] = 0; if (e.final || tries >= 3) { failure = e; break; } await new Promise(r => setTimeout(r, 1500 * (tries + 1))); }
      }
    }
  };
  try {
    await Promise.all([worker(), worker()]);
    if (failure) throw failure;
    await send(`/api/upload/${s.id}/finish`, {});
    f.pct = 100; f.resumeUploadId = null; await loadPendingUploads(); drawAtt();
  } catch (e) {
    f.resumeUploadId = s.id; await loadPendingUploads();
    throw e;
  }
}
function sendFile(f, who) {
  if (S.status.upload_part_mb && f.file.size > S.status.upload_part_mb * 1048576) return sendBig(f, who);
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest(), fd = new FormData();
    fd.append("file", f.file); fd.append("options", JSON.stringify(jobOptions())); fd.append("creator", who); fd.append("rights_cleared", "true");
    x.open("POST", "/api/upload");
    x.upload.onprogress = e => { if (e.lengthComputable) { f.pct = Math.round(e.loaded / e.total * 100); drawAtt(); } };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) return ok();
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      fail(new Error(typeof d === "string" ? d : "Upload failed"));

async function makeClips() {
  if (!rightsGateReady()) { toast("Restart MJ Cliproom before making clips.", "bad"); return; }
  const A = att();
  if (A.busy) return;
  const typed = $("#url")?.value.trim();
  if (typed && looksLink(typed) && !isChannel(typed)) { clearTimeout(linkTimer); takeLink(A, typed, $("#url")); }
  if (A.links.some(l => l.state === "wait")) {   // still looking a link up: start as soon as it is found
    A.queued = true; drawAtt();
    toast("Finding the video first. Clipping starts as soon as it's found.");
    return;
  }
  if (!canGo(A)) {
    toast(A.note || "Paste a YouTube, Twitch or Kick video link, or add a video file first.", "bad");
    $("#url")?.focus();
    return;
  }
  A.busy = true; drawAtt();
  let started = 0, failed = 0;
  const who = targetCreator(), opts = jobOptions();
  for (const l of A.links.filter(x => x.state === "ok")) {
    l.sending = true; drawAtt();
    try { await send("/api/jobs", {url: l.url, options: opts, creator: who, rights_cleared: true}); l.state = "done"; started++; }
    catch (e) { l.state = "bad"; l.msg = e.message; failed++; }
    l.sending = false; drawAtt();
  }
  for (const f of A.files) {
    f.state = "up"; f.pct = 0; drawAtt();
    try { await sendFile(f, who); f.state = "done"; started++; }
    catch (e) { f.state = "error"; f.err = e.message; failed++; }
    drawAtt();
  }
  A.links = A.links.filter(l => l.state !== "done");
  A.files = A.files.filter(f => { if (f.state === "done") { URL.revokeObjectURL(f.src); return false; } return true; });
  A.busy = false; drawAtt();
  if (started) {
    toast(`${started === 1 ? "Your video is" : started + " videos are"} being clipped now.`, "ok");
    if (!failed && S.view === "overview") go(who ? "c:" + who : "library"); else tick();
  } else if (failed) toast("Nothing was started. The reason is shown on the video.", "bad");
}

function barChart(daily) {

  const peak = Math.max(1, ...daily.map(d => Math.max(d.clips, d.posted)));
  const step = Math.max(1, Math.ceil(peak / 4)), top = step * 4, cw = (W - pl) / n, bw = Math.min(14, (cw - 10) / 2);
  const y = v => pt + ch * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 4; i++) g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}"/><text x="${pl - 8}" y="${y(i * step) + 4}" text-anchor="end">${i * step}</text>`;
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], {day:"numeric", month:"short"});
    g += `<g><title>${lab}: ${d.clips} clips made, ${d.posted} posted${d.views ? ", " + d.views.toLocaleString() + " views" : ""}</title>
      <rect class="b1" x="${cx - bw - 1}" y="${y(d.clips)}" width="${bw}" height="${Math.max(0, ch * d.clips / top)}" rx="3"/>
      <rect class="b2" x="${cx + 1}" y="${y(d.posted)}" width="${bw}" height="${Math.max(0, ch * d.posted / top)}" rx="3"/>
      <rect x="${pl + i * cw}" y="${pt}" width="${cw}" height="${ch}" fill="transparent"/></g>`;
    if (i % 2 === (n - 1) % 2) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
  });
  const none = daily.every(d => !d.clips && !d.posted) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No clips in the last 14 days yet</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Clips made and posted per day, last 14 days">${g}${none}</svg>`;
}

let _apTicker = null;
let _apFilter = "all";
let _apSearch = "";

async function loadAutopilotPosts() {
  const box = $("#autoposts");
  if (!box) return;
  box.innerHTML = `<div class="set-load">Loading Autopilot clips & review queue…</div>`;
  try {
    const res = await api("/api/v12/autopilot-posts");
    S.autopilotData = res;
    S.autopilotPostsCount = res.total_count || (res.clips || []).length;
    drawShell();
    drawAutopilotPosts();
  } catch (err) {
    const notFound = err.message && err.message.toLowerCase().includes("not found");
    box.innerHTML = `<div class="card" style="padding:24px;text-align:center">
      <p class="err" style="margin-bottom:12px">${notFound ? "The posting view could not load. Restart the app and retry." : esc(err.message)}</p>

        <button class="btn sm ${notFound ? "" : "primary"}" data-act="load-autoposts">Retry</button>
      </div>
    </div>`;
  }
}

function formatRemaining(dueAt) {
  const diff = Math.max(0, Math.floor(dueAt - Date.now() / 1000));
  const m = Math.floor(diff / 60);
  const s = diff % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function startCountdownTimer() {
  if (_apTicker) clearInterval(_apTicker);
  _apTicker = setInterval(() => {
    const timers = $$(".countdown-timer[data-due]");
    if (!timers.length) return;
    timers.forEach(t => {
      const due = Number(t.dataset.due || 0);
      const remaining = Math.max(0, Math.floor(due - Date.now() / 1000));
      if (remaining <= 0) {
        t.textContent = "00:00 (Uploading now...)";
      } else {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        t.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }
    });
  }, 1000);
}

/* ============================================================ AI usage */
async function loadUsage() {
  try { S.usage = await api("/api/usage"); } catch { return; }
  S.status.ai = {...S.status.ai, ready: S.usage.ready, provider: S.usage.provider, model: S.usage.model, today_calls: S.usage.today_calls, today_tokens: S.usage.today_tokens};
  drawShell(); drawUsage();
}
function tokenChart(daily) {
  const W = 1000, H = 220, pl = 64, pb = 26, pt = 10, n = daily.length, ch = H - pt - pb;
  const peak = Math.max(...daily.map(d => d.tokens), 1), top = peak * 1.15, cw = (W - pl) / n, bw = Math.min(14, cw - 6);
  const y = v => pt + ch * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = top * i / 3; g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmtK(Math.round(v))}</text>`; }
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], {day:"numeric", month:"short"});
    g += `<g><title>${lab}: ${d.tokens.toLocaleString()} tokens in ${d.calls} call${d.calls === 1 ? "" : "s"}</title><rect class="b1" x="${cx - bw / 2}" y="${y(d.tokens)}" width="${bw}" height="${Math.max(0, ch * d.tokens / top)}" rx="3"/></g>`;
    if ((n - 1 - i) % 5 === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
  });
  const none = daily.every(d => !d.tokens) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No AI used in the last 30 days</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="AI tokens used per day, last 30 days">${g}${none}</svg>`;
}
function hbars(rows) {
  const total = rows.reduce((a, r) => a + r[1], 0) || 1;
  return rows.length ? `<div class="hbar">${rows.map(r => `<div class="hbar-row"><div class="top"><span>${esc(r[0])}</span><span>${fmtK(r[1])} tokens · ${r[2]} call${r[2] === 1 ? "" : "s"}</span></div>
    <div class="track"><i style="width:${Math.max(2, r[1] / total * 100)}%"></i></div></div>`).join("")}</div>` : `<p class="help">Nothing yet.</p>`;
}
function drawUsage() {
  const k = S.usage, box = $("#usage"); if (!k || !box) return;
  box.innerHTML = `${k.ready ? "" : `<div class="note">${ic("warn")}<span>${S.status.user?.is_admin ? "No AI key is set, so clips are picked by loudness only. Add your key under Settings, AI." : "The AI isn't set up on this server yet, so clips are picked by loudness."}</span></div>`}
    <div class="tiles five" style="margin-top:${k.ready ? 0 : 16}px">
      <div class="tile"><i>${ic("bolt")}</i><b>${k.ready ? esc(k.provider || "Ready") : "Not set up"}</b><span>${k.ready && k.model ? esc(k.model) : "AI service"}</span></div>
      <div class="tile"><i>${ic("clock")}</i><b>${(k.today_calls || 0).toLocaleString()}</b><span>AI calls today</span></div>
      <div class="tile"><i>${ic("chart")}</i><b>${fmtK(k.today_tokens)}</b><span>Tokens today</span></div>
      <div class="tile"><i>${ic("scissors")}</i><b>${(k.calls_total || 0).toLocaleString()}</b><span>AI calls in total</span></div>
      <div class="tile"><i>${ic("receipt")}</i><b>${fmtK(k.tokens_total)}</b><span>Tokens in total</span></div></div>
    <div class="card"><div class="card-head"><div><h2>Tokens per day</h2><p class="sub">Last 30 days. Your AI provider bills you for these directly.</p></div></div>${tokenChart(k.daily || [])}</div>
    <div class="split">
      <div class="card"><div class="card-head"><div><h2>What it was used for</h2><p class="sub">By kind of AI work, all time</p></div></div>${hbars(k.by_purpose || [])}</div>

async function openDailyCompilation() {
  const dlg = $("#formdlg");
  const jobsList = (S.jobs || []).filter(j => j.status === "done" && j.clips?.some(c => c.status === "done"));
  const allClips = [];
  jobsList.forEach(j => {
    (j.clips || []).filter(c => c.status === "done").forEach(c => {
      allClips.push({jid: j.id, cid: c.id, title: c.title || c.hook || "Clip", cover: c.cover});
    });
  });
  dlg.innerHTML = `<div class="dlg" style="max-width:580px"><h2>${ic("film")} Daily Compilation Creator</h2>
    <p class="help">Stitch multiple 9:16 vertical clips into a single daily highlight video using GPU/ffmpeg demuxer.</p>
